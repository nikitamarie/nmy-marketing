name = "nmy-marketing"
main = "src/worker.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# App-Dateien werden direkt in den Worker gebündelt (siehe src/static.js)
rules = [
  { type = "Text", globs = ["gen/*.html", "**/gen/*.html", "**/public/*.html", "**/public/*.css", "**/public/*.webmanifest", "**/public/app.js", "**/public/photo.js", "**/public/retouch.js", "**/public/video.js", "**/public/vendor/**/*.js", "**/public/sw.js"], fallthrough = false },
  { type = "Data", globs = ["**/public/*.png", "**/public/fonts/*.woff2"], fallthrough = false },
]
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "nmy-marketing"
database_id = "df7fe0a6-80bd-4f3c-86e5-2dcd0767fb4e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nmy-marketing-media"

[browser]
binding = "BROWSER"

[triggers]
# alle 15 Minuten: veröffentlichen, rendern, Instagram-Zahlen, Token erneuern
crons = ["*/15 * * * *"]

[vars]
TIMEZONE = "Europe/Berlin"
TREATWELL_URL = "https://buchung.treatwell.de/ort/475384/menue/"
WHATSAPP_NUMBER = "4917664044729"
